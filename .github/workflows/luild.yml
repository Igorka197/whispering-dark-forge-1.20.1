name: Build Forge 1.20.1 Horror Mod JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Forge Mod JAR
        run: gradle build --no-daemon

      - name: Package JAR into ZIP
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          cd dist && zip -r ../whisperingdark-1.20.1-forge-jar.zip *.jar

      - name: Upload Compiled Mod JAR & ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperingdark-1.20.1-forge-jar
          path: |
            build/libs/*.jar
            whisperingdark-1.20.1-forge-jar.zip

      - name: Create GitHub Release with JAR and ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "The Whispering Dark v1.0.${{ github.run_number }} (Forge 1.20.1)"
          files: |
            build/libs/*.jar
            whisperingdark-1.20.1-forge-jar.zip
